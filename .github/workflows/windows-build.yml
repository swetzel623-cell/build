# Builds the pinned Blender source with the gas-step overlay on Windows and uploads a portable
# zip. Start it from the Actions tab ("Run workflow").
#
# sccache keeps every compiled file between runs (in the Actions cache, keyed by the Blender
# commit), so a run recompiles only the files that changed since the last one. The first run
# after the cache is empty or evicted compiles everything, which takes about two hours.
name: Windows test build

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/windows-build.yml"]

env:
  BLENDER_COMMIT: 377d577d520472f2702e456b26c17dffc663dc52
  SOURCE_DIR: C:\bl
  BUILD_DIR: C:\bb
  DIST_DIR: C:\dist\blender-gas-step

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - name: Check out the overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Install sccache
        shell: pwsh
        run: |
          $version = "v0.8.2"
          $name = "sccache-$version-x86_64-pc-windows-msvc"
          Invoke-WebRequest -Uri "https://github.com/mozilla/sccache/releases/download/$version/$name.zip" -OutFile "$env:RUNNER_TEMP\sccache.zip"
          Expand-Archive "$env:RUNNER_TEMP\sccache.zip" -DestinationPath "C:\sccache-bin"
          "C:\sccache-bin\$name" | Out-File -FilePath $env:GITHUB_PATH -Append
          "SCCACHE_DIR=C:\sccache" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SCCACHE_CACHE_SIZE=6G" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The newest cache of this Blender commit. Each run saves a new one under its own key.
      - name: Restore the compiler cache
        id: restore_cache
        uses: actions/cache/restore@v4
        with:
          path: C:\sccache
          key: sccache-windows-${{ env.BLENDER_COMMIT }}-${{ github.run_id }}
          restore-keys: sccache-windows-${{ env.BLENDER_COMMIT }}-

      - name: Fetch Blender at the pinned commit
        shell: bash
        run: |
          git config --global core.longpaths true
          git config --global advice.detachedHead false
          mkdir -p /c/bl && cd /c/bl
          git init -q .
          git remote add origin https://projects.blender.org/blender/blender.git
          git fetch --depth 1 origin "$BLENDER_COMMIT"
          git checkout -q FETCH_HEAD
          git rev-parse HEAD

      - name: Fetch Blender's precompiled Windows libraries
        shell: bash
        run: |
          cd /c/bl
          lib_commit=$(git ls-tree HEAD lib/windows_x64 | awk '{print $3}')
          echo "lib/windows_x64 at $lib_commit"
          mkdir -p lib/windows_x64 && cd lib/windows_x64
          git init -q .
          git remote add origin https://projects.blender.org/blender/lib-windows_x64.git
          git fetch --depth 1 origin "$lib_commit"
          git checkout -q FETCH_HEAD
          rm -rf .git/lfs/objects
          df -h /c

      # glslangValidator compiles the sparse solver's GPU kernels. Blender's own libraries supply
      # the Vulkan headers; the Vulkan loader is opened at run time.
      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" -OutFile "$env:RUNNER_TEMP\vulkan_sdk.exe"
          $install = Start-Process -FilePath "$env:RUNNER_TEMP\vulkan_sdk.exe" -Wait -PassThru -ArgumentList "--root","C:\VulkanSDK\sdk","--accept-licenses","--default-answer","--confirm-command","install"
          if ($install.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($install.ExitCode)" }
          "VULKAN_SDK=C:\VulkanSDK\sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply the gas-step overlay
        shell: bash
        run: |
          python overlay/blender/apply_integration.py /c/bl --check
          python overlay/blender/apply_integration.py /c/bl

      - name: Configure and build
        id: build
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          cmake -S %SOURCE_DIR% -B %BUILD_DIR% -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=%DIST_DIR% ^
            -DWITH_CYCLES=OFF ^
            -DWITH_GTESTS=OFF ^
            -DWITH_BUILDINFO=OFF ^
            -DWITH_WINDOWS_RELEASE_PDB=OFF ^
            -DWITH_WINDOWS_SCCACHE=ON || exit /b 1
          findstr /C:"SPARSE_GAS_GLSLANG:FILEPATH=C:" %BUILD_DIR%\CMakeCache.txt || (echo The sparse solver's GPU kernels were not enabled & exit /b 1)
          sccache --zero-stats
          cmake --build %BUILD_DIR% --target install || exit /b 1
          sccache --show-stats
          dir %DIST_DIR%

      # Saved even if the build failed part way, so the next run keeps what did compile.
      - name: Save the compiler cache
        if: always() && steps.restore_cache.outcome == 'success'
        shell: bash
        run: sccache --stop-server || true
      - name: Upload the compiler cache
        if: always() && steps.restore_cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: C:\sccache
          key: sccache-windows-${{ env.BLENDER_COMMIT }}-${{ github.run_id }}

      # Add Modifier > Physics > Pyro Simulation, and the Pyro building blocks in the
      # node editor: node-group assets written into the build's own Essentials library.
      - name: Install the smoke assets
        shell: cmd
        run: |
          %DIST_DIR%\blender.exe -b --factory-startup --python overlay\blender\assets\smoke_assets.py || exit /b 1
          dir /s /b %DIST_DIR%\pyro_simulation_assets.blend || exit /b 1
          rem Updating the assets later needs no rebuild: a newer smoke_assets.py next to
          rem blender.exe, then a double-click on update_pyro_assets.bat.
          copy overlay\blender\assets\smoke_assets.py %DIST_DIR%\ || exit /b 1
          copy overlay\blender\assets\update_pyro_assets.bat %DIST_DIR%\ || exit /b 1

      - name: Run the in-Blender runtime tests
        id: tests
        continue-on-error: true
        shell: cmd
        run: |
          %DIST_DIR%\blender.exe -b --factory-startup --python overlay\blender\tests\gas_node_runtime_tests.py -- --work %RUNNER_TEMP%\gas_tests
          set NODE_TESTS=%ERRORLEVEL%
          %DIST_DIR%\blender.exe -b --factory-startup --python overlay\blender\tests\smoke_modifier_tests.py
          set MODIFIER_TESTS=%ERRORLEVEL%
          if not "%NODE_TESTS%"=="0" exit /b 1
          if not "%MODIFIER_TESTS%"=="0" exit /b 1

      - name: Record what was built
        shell: bash
        run: |
          {
            echo "Runtime tests: ${{ steps.tests.outcome }}"
            echo "Blender commit: $BLENDER_COMMIT"
            echo "Overlay commit: ${{ github.sha }}"
          } > /c/dist/blender-gas-step/GAS_STEP_BUILD.txt
          test -f /c/dist/blender-gas-step/blender.exe

      # upload-artifact zips the folder itself; the download is a single zip.
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: blender-gas-step-windows-x64
          path: C:\dist\blender-gas-step
          if-no-files-found: error
          retention-days: 14

      - name: Fail if the runtime tests failed
        if: steps.tests.outcome != 'success'
        shell: bash
        run: |
          echo "The build was uploaded, but the in-Blender runtime tests did not pass."
          exit 1
